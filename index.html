<!DOCTYPE html>
<html>
<head>
  <title>HDB Lift - Claustrophobia Scenario</title>

  <!-- A-Frame core + plugins (must come first) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://supereggbert.github.io/aframe-htmlembed-component/dist/build.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.5.0/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/sequenceBase.js"></script>
  <script src="js/sequence01.js"></script>
  <script src="js/sequence02.js"></script>
  <script src="js/sequence03.js"></script>
  <script src="js/sequence04.js"></script>
  <script src="js/sequence05.js"></script>
  <script>navigator.serviceWorker.register("service-worker.js")</script> 

  <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
  <link rel="manifest" href="manifest.json">

  <style>
    #loading-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0);
      display: flex;
      justify-content: center; align-items: center;
      color: white; font-size: 36px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: bold; z-index: 1000;
    }

    :root {
      --rest-fill: rgba(255, 255, 255, 1);
      --rest-border: rgba(0, 71, 178, 1);
      --rest-text: rgb(0, 30, 75);
      --hover-fill: rgba(179, 214, 255, 1);
      --hover-border: rgba(0, 99, 249, 1);
      --hover-text: #0c3376;
      --selected-fill: rgb(0, 53, 132);
      --selected-border: #F2F2F7;
      --selected-text: #FFFFFF;
    }

    /* Fixed 1215x540 stage mapping exactly to Figma Frame 7 & 8 bounds */
    .stage {
      width: 1215px;
      height: 540px;
      position: relative;
      border-radius: 10px;
      background:transparent;
    }

    .panel {
      position: absolute; width: 542px; height: 458px;
      left: 345px; top: 53px;
      background: rgba(199, 199, 199, 0.92);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    .title {
      position: absolute; width: 482px; height: 92px;
      left: 42px; top: 15px; text-align: center;
      color: rgb(0, 22, 55);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .title .bold { font-weight: 1000; font-size: 24px; line-height: 29px; }
    .title .sub  { font-weight: 850; font-style: italic; font-size: 18px; margin-top: 4px; }

    /* Buttons */
    .btn, .sub-btn, .replay-btn { cursor: pointer; } 
    .replay-btn {
      all: unset; box-sizing: border-box; position: absolute;
      top: 18px; right: 18px; width: 102px; height: 62.4px;
      border-radius: 18px;
      border: 2px solid var(--rest-border);
      background: var(--rest-fill); color: var(--rest-text);
      font-weight: 900; font-size: 19px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      z-index: 2;
      transition: all 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .replay-icon {
      font-size: 24px;
      line-height: 1;
    }
    .replay-btn[hidden] { display: none; }

    .btn {
      all: unset; box-sizing: border-box; position: absolute;
      left: 103px; width: 359px; border-radius: 24px;
      border: 2.5px solid var(--rest-border);
      background: var(--rest-fill); color: var(--rest-text);
      font-weight: 1000; font-size: 28px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #introBtn { top: 130px; height: 86.46px; }
    #interBtn { top: 239px; height: 86.46px; }
    #advBtn   { top: 348px; height: 86.46px; }

    .panel.expanded #introBtn { height: 54.02px; }
    .panel.expanded #interBtn { top: 310px; height: 54.02px; }
    .panel.expanded #advBtn   { top: 379.44px; height: 54.02px; }

    .sub-btn {
      all: unset; box-sizing: border-box; position: absolute;
      top: 197px; width: 109.41px; height: 100px; border-radius: 24px;
      border: 2px solid var(--rest-border);
      background: var(--rest-fill); color: var(--rest-text);
      font-weight: 850; font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transform: scale(0.95);
      transition: all 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #subStandard { left: 103px; } #subEmpty { left: 228px; } #subCrowded { left: 353px; }

    .panel.expanded .sub-btn { opacity: 1; pointer-events: auto; transform: scale(1); }

    .btn:hover:not(.selected), .sub-btn:hover:not(.selected), .replay-btn:hover:not(.selected) {
      background: var(--hover-fill); border-color: var(--hover-border); color: var(--hover-text);
    }
    .btn.selected, .sub-btn.selected, .replay-btn.selected {
      background: var(--selected-fill); border-color: var(--selected-border); color: var(--selected-text);
    }

  </style>
</head>
<body>

<div id="loading-overlay">LOADING...</div>

<a-scene
  webxr="referenceSpaceType: local"
  renderer="colorManagement: true; physicallyCorrectLights: true; exposure: 1.2; toneMapping: ACESFilmic;"
  gltf-model="basisTranscoderPath: https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/;"
  background="color: #222">

  <a-assets timeout="120000">
  <img id="tex-loop"   src="assets/floor-scroll.png">
  <img id="tex-first"  src="assets/first-floor-lobby.png">
  <img id="tex-lobby"  src="assets/lobby-environment.png">
  <img id="tex-lowest"  src="assets/hdb-view-lowest.png">
  <img id="tex-lower" src="assets/hdb-view-lower.png">
  <img id="tex-middle-low" src="assets/hdb-view-middle-low.png">
  <img id="tex-middle-up" src="assets/hdb-view-middle-up.png">
  <img id="tex-upper"  src="assets/hdb-view-upper.png">
  <img id="tex-uppest"  src="assets/hdb-view-uppest.png">
  <img id="tex-fifty"  src="assets/hdb-view-fifty.png">

  <!-- Lift sound effects -->
    <audio id="lift-move-sound"  src="assets/sounds/LiftMoving.mp3"></audio>
    <audio id="lift-door-open"   src="assets/sounds/DoorOpen.mp3"></audio>
    <audio id="lift-door-close"  src="assets/sounds/DoorClose.mp3"></audio>
    <audio id="lift-ding"        src="assets/sounds/Ding.mp3"></audio>
    <audio id="voice-going-up"   src="assets/sounds/Voice_GoingUp.mp3"></audio>
    <audio id="voice-going-down" src="assets/sounds/Voice_GoingDown.mp3"></audio>
    <audio id="voice-door-close" src="assets/sounds/Voice_DoorsClosing.mp3"></audio>

    <!-- Lift interior texture -->
    <img id="safety-poster-tex"  src="assets/poster.jpg">
  </a-assets>

  <script>
    (function () {
      // const isLocal = ['localhost', '127.0.0.1'].includes(window.location.hostname);
      const base    = 'assets/';
        // ? 'assets/'
        // : 'https://huggingface.co/datasets/MiraJ102/cgh-assets/resolve/main/';

      const assets = document.querySelector('a-assets');
      [
        { id: 'elevator',      file: 'elevator.final.glb'   },
        { id: 'mainCharacter', file: 'main_char.opt.glb'  }
      ].forEach(({ id, file }) => {
        const item = document.createElement('a-asset-item');
        item.setAttribute('id',  id);
        item.setAttribute('src', base + file);
        assets.appendChild(item);
      });

      // console.log(isLocal
      //   ? '[shell] Running locally — using local assets.'
      //   : '[shell] Running remote — using Hugging Face assets.'
      // );
    })();
  </script>

  <!--
    Player rig lives in the shell, not in any sequence fragment.

    Reason: A-Frame creates a "default camera" if NO camera entity exists when
    the scene initialises. If the rig were injected later (dynamically by
    main.js), that default camera would be first in the DOM and would be
    returned by document.querySelector('[camera]') — causing body-sync to track
    the wrong camera and splitting the view from the body.

    Keeping the rig here guarantees:
      • A-Frame never creates a default camera.
      • body-sync always finds #mainCamera (the only camera in the document).
      • The mainCharacterEntity can resolve #mainCharacter from <a-assets>
        because the inline GLB loader above has already added it.
  -->
  <a-entity id="rig"
    vr-height-fix
    rotation="0 -90 0"
    animation__pan="property: position; to: -1.165 ${currentY} 0; startEvents: panCameraIn; dur: 4500; easing: easeInOutQuad"
    animation__turn="property: rotation; to: 0 90 0; startEvents: turnCameraAround; dur: 4000; easing: easeInOutQuad">

    <!-- Camera given an explicit ID so body-sync has an unambiguous target -->
    <a-entity id="mainCamera" 
      camera 
      look-controls="enabled: true" 
      position="0 1.6 0"
      cursor="rayOrigin: mouse; fuse: false"
      raycaster="objects: [htmlembed]">
    </a-entity>
    <a-entity id="bodyWrapper" body-sync="camera: #mainCamera" position="0 -0.82 0">
      <a-entity id="mainCharacterEntity"
        gltf-model="#mainCharacter"
        rotation="0 180 0" position="0 0 0.15" scale="1.4 1.4 1.4"
        animation-mixer="clip: Idle; loop: repeat">
      </a-entity>
    </a-entity>

    <a-entity
      oculus-touch-controls="hand: left; model: false"
      vive-controls="hand: left; model: false"
      windows-motion-controls="hand: left; model: false"
      vr-controller-input
      sequence-controller>
    </a-entity>

    <a-entity
      oculus-touch-controls="hand: right; model: false"
      vive-controls="hand: right; model: false"
      windows-motion-controls="hand: right; model: false"
      vr-controller-input
      sequence-controller>
    </a-entity>

  </a-entity>

  <a-entity id="vr-menu-container"
    htmlembed
    fix-ui-rendering
    material="shader: flat"
    vr-sequence-menu
    visible="false"
    position="-2.5 3 0"
    rotation="0 -90 0">
    
    <!-- This is pure HTML from your menu-demo.html -->
    <div class="stage">
      <div class="panel" id="panel">
        <button class="replay-btn" id="replayBtn" hidden><span class="replay-icon">↺</span>Replay</button>
        <div class="title">
          <div class="bold">Welcome to the<br>CGH Clinical Simulation.</div>
          <div class="sub">Please select a scenario to start:</div>
        </div>
        
        <button class="btn" id="introBtn">Introductory</button>
        
        <button class="sub-btn" id="subStandard">Standard</button>
        <button class="sub-btn" id="subEmpty">Empty</button>
        <button class="sub-btn" id="subCrowded">Crowded</button>
        
        <button class="btn" id="interBtn">Intermediate</button>
        <button class="btn" id="advBtn">Advanced</button>
      </div>
    </div>
  </a-entity>

  <a-entity id="persistent-environment">
    <a-entity environment="preset: forest"></a-entity>

    <!-- ── Elevator GLB with all sound slots attached ── -->
    <a-entity id="elevatorModel"
      gltf-model="#elevator"
      position="0 1 0" rotation="0 0 0" scale="1 1 1"
      animation-mixer="clip: none"
      sound="src: #lift-move-sound; poolSize: 2; volume: 4; loop: true"
      animation__fadein="property: sound.volume; from: 0; to: 4; dur: 2000; easing: linear; startEvents: fade-in"
      animation__fadeout="property: sound.volume; from: 4; to: 0; dur: 2000; easing: linear; startEvents: fade-out"
      sound__dooropen="src: #lift-door-open;    poolSize: 2; volume: 4"
      sound__doorclose="src: #lift-door-close;  poolSize: 2; volume: 4"
      sound__ding="src: #lift-ding;             poolSize: 2; volume: 1"
      sound__voiceup="src: #voice-going-up;     poolSize: 2; volume: 1"
      sound__voicedown="src: #voice-going-down; poolSize: 2; volume: 1"
      sound__voicedoorclose="src: #voice-door-close; poolSize: 2; volume: 1">
    </a-entity>

    <!-- ── Floor displays ── -->

    <!-- Outside the lift door (facing the corridor) -->
    <a-box id="outside-screen-display"
      position="-2.042 4.124 0" width="0.631" height="0.231" depth="0.0483"
      color="#111111" rotation="0 -90 0">
      <a-triangle class="lift-arrow"
        vertex-a="0 0.08 0" vertex-b="-0.08 -0.08 0" vertex-c="0.08 -0.08 0"
        color="#FF0000" position="-0.15 0 0.0244" rotation="0 0 0"
        scale="0.9 0.9 0.9" visible="true">
      </a-triangle>
      <a-text class="lift-floor"
        value="1" color="#FF0000" align="center"
        position="0.12 0 0.02415" scale="0.9 0.9 0.9"
        font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
      </a-text>
    </a-box>

    <!-- Inside the lift (facing the passenger) -->
    <a-box id="inside-screen-display"
      position="-1.482 4.124 0" width="0.631" height="0.231" depth="0.0483"
      color="#111111" rotation="0 90 0">
      <a-triangle class="lift-arrow"
        vertex-a="0 0.08 0" vertex-b="-0.08 -0.08 0" vertex-c="0.08 -0.08 0"
        color="#FF0000" position="-0.15 0 0.0244" rotation="0 0 0"
        scale="0.9 0.9 0.9" visible="true">
      </a-triangle>
      <a-text class="lift-floor"
        value="1" color="#FF0000" align="center"
        position="0.12 0 0.02415" scale="0.9 0.9 0.9"
        font="https://cdn.aframe.io/fonts/Roboto-msdf.json">
      </a-text>
    </a-box>

    <!-- ── Shaft view ── -->

    <!-- Looping scroll texture shown during transit -->
    <a-image id="scrolling-shaft"
      position="-2 2 0" rotation="0 90 0" width="1" height="9.2"
      material="src: #tex-loop; repeat: 1 4;"
      texture-scroller="speed: 0.35; direction: down"
      visible="false">
    </a-image>

    <!-- 1st Floor Sky (No Background Needed) -->
    <a-sky id="first-floor"
      position="-2.7 3.6 0" radius="6" src="#tex-first" 
      material="transparent: true" rotation="0 177 0" visible="false">
    </a-sky>

    <!-- Upper Floors Shared Lobby Sky -->
    <!-- Added alphaTest: 0.5 to prevent transparency sorting bugs with backgrounds -->
    <a-sky id="lobby-environment" 
      position="-2.4 3.05 0" radius="4.5" src="#tex-lobby" 
      material="transparent: true; alphaTest: 0.5" rotation="0 177 0" visible="false">
    </a-sky>

    <!-- Outside Views for Upper Floors (Backgrounds) -->
    <a-entity id="outside-views" position="-2.45 3.7 0">
      <a-curvedimage id="bg-lowest" radius="4.7" height="5.1" theta-length="119" rotation="0 210.5 0" src="#tex-lowest" visible="false"></a-curvedimage>
      <a-curvedimage id="bg-lower" radius="4.7" height="5.1" theta-length="119" rotation="0 210.5 0" src="#tex-lower" visible="false"></a-curvedimage>
      <a-curvedimage id="bg-middle-low" radius="4.7" height="5.1" theta-length="119" rotation="0 210.5 0" src="#tex-middle-low" visible="false"></a-curvedimage>
      <a-curvedimage id="bg-middle-up" radius="4.7" height="5.1" theta-length="119" rotation="0 210.5 0" src="#tex-middle-up" visible="false"></a-curvedimage>
      <a-curvedimage id="bg-upper" radius="4.7" height="5.1" theta-length="119" rotation="0 210.5 0" src="#tex-upper" visible="false"></a-curvedimage>
      <a-curvedimage id="bg-uppest" radius="4.7" height="5.1" theta-length="119" rotation="0 210.5 0" src="#tex-uppest" visible="false"></a-curvedimage>
      <a-curvedimage id="bg-fifty" radius="4.7" height="5.1" theta-length="119" rotation="0 210.5 0" src="#tex-fifty" visible="false"></a-curvedimage>
    </a-entity>

    <!-- ── Lift interior: safety poster ── -->
    <!-- Note: the asset id is "safety-poster-tex" (on the <img> above);
        this entity has no id of its own to avoid duplicate IDs. -->
    <a-image
      position="1.4 3.1 0" rotation="0 -90 0" width="0.8" height="1.15"
      material="src: #safety-poster-tex; transparent: true; opacity: 1">
    </a-image>

    <!-- ── Lighting ── -->
    <a-light type="ambient" intensity="0.35" color="#dfe8ff"></a-light>
    <a-light type="spot"
      position="1 4.8 0" rotation="-90 0 0"
      angle="85" penumbra="0.1" intensity="7" color="#fff5e6"
      distance="10" decay="0.1">
    </a-light>
    <a-light type="spot"
      position="0 2 -1"
      angle="45" penumbra="0.5" intensity="0.6" color="#ffffff"
      target="#liftTarget">
    </a-light>
    <a-entity id="liftTarget" position="0 1 0"></a-entity>

  </a-entity>

  <!-- Add raycaster properties to your right hand controller -->
  <a-entity
    oculus-touch-controls="hand: right; model: false"
    vive-controls="hand: right; model: false"
    windows-motion-controls="hand: right; model: false"
    vr-controller-input
    sequence-controller
    raycaster="objects: [htmlembed]; far: 10" 
    laser-controls="hand: right"
    cursor="fuse: false">
  </a-entity>

</a-scene>

<!-- main.js runs after the DOM is ready and injects the sequence's entities -->
<script src="js/main.js"></script>

</body>
</html>
